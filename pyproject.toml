[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "registry-hive-review"
version = "0.1.2"
description = "Bounded offline primary Registry hive and explicit persistence-value evidence"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
authors = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
registry-hive-review = "registry_hive_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
registry_hive_review = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
