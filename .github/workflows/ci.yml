name: registry-hive-review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Source tests and complete build
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=src python -m unittest discover -s tests -v
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m build --no-isolation
      - name: Independent offline consumer tests and CLI
        run: |
          python -m venv .install-check
          .install-check/bin/python -m pip install --no-index --no-deps dist/registry_hive_review-0.1.2-py3-none-any.whl
          .install-check/bin/python -m pip check
          install_python="$PWD/.install-check/bin/python"
          repo_root="$PWD"
          cd "$TMPDIR"
          "$install_python" -I -m unittest discover -s "$repo_root/tests" -v
          "$install_python" -I "$repo_root/scripts/installed_cli_check.py"
          installed_dir=$("$install_python" -I -c 'import pathlib,registry_hive_review; print(pathlib.Path(registry_hive_review.__file__).parent.parent)')
          "$install_python" -I "$repo_root/scripts/verify_package.py" "$repo_root" --installed "$installed_dir"
